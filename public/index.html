<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Mini Dating Site</title>

  <!-- Google font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#0f1724;
      --card:#0b1220;
      --muted:#9aa4b2;
      --accent:#ff6b81;
      --accent-2:#6be7c4;
      --glass: rgba(255,255,255,0.04);
      --radius:14px;
      --max-width:1100px;
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial;
      background:
        radial-gradient(1200px 600px at 10% 10%, rgba(107,231,196,0.06), transparent 10%),
        radial-gradient(900px 500px at 90% 90%, rgba(255,107,129,0.04), transparent 10%),
        var(--bg);
      color:#e6eef6;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      padding:40px 20px;
      display:flex;
      justify-content:center;
      align-items:flex-start;
      gap:24px;
    }

    .container{
      width:100%;
      max-width:var(--max-width);
      display:grid;
      grid-template-columns: 360px 1fr;
      gap:28px;
      align-items:start;
    }

    header{
      grid-column:1 / -1;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:16px;
      margin-bottom:6px;
    }

    .brand{
      display:flex;
      gap:14px;
      align-items:center;
    }

    .logo{
      width:56px;
      height:56px;
      border-radius:12px;
      background:linear-gradient(135deg,var(--accent),#ff9fb3);
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:700;
      color:white;
      box-shadow:0 6px 18px rgba(0,0,0,0.5);
      flex-shrink:0;
    }

    h1{font-size:20px;margin:0}
    p.lead{margin:0;color:var(--muted);font-size:13px}

    /* Left column: auth */
    .card{
      background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      border-radius:var(--radius);
      padding:18px;
      box-shadow: 0 6px 30px rgba(2,6,23,0.6);
      border:1px solid rgba(255,255,255,0.03);
    }

    #auth h2{font-size:16px;margin:0 0 12px 0}
    form{display:flex;flex-direction:column;gap:10px}
    input[type="text"], input[type="password"], input[type="number"]{
      background:var(--glass);
      border:1px solid rgba(255,255,255,0.04);
      color:var(--muted);
      padding:12px 14px;
      border-radius:10px;
      outline:none;
      font-size:14px;
    }
    input::placeholder{color:rgba(255,255,255,0.25)}
    button{
      background:linear-gradient(90deg,var(--accent),#ff8aa0);
      color:white;
      border:none;
      padding:10px 14px;
      border-radius:10px;
      font-weight:600;
      cursor:pointer;
      transition:transform .12s ease, box-shadow .12s ease;
      box-shadow:0 6px 18px rgba(255,107,129,0.12);
    }
    button:hover{transform:translateY(-3px); box-shadow:0 12px 30px rgba(255,107,129,0.14)}
    .secondary{
      background:transparent;
      border:1px dashed rgba(255,255,255,0.04);
      color:var(--accent-2);
      box-shadow:none;
    }

    #auth-message{color:var(--accent-2);font-size:13px;margin-top:8px}

    /* Right column: search & profiles */
    #search h2{font-size:16px;margin:0 0 12px 0}
    .controls{
      display:flex;
      gap:10px;
      margin-bottom:12px;
      align-items:center;
    }
    .controls input[type="text"]{
      flex:1;
      background:transparent;
      border:1px solid rgba(255,255,255,0.04);
      padding:10px 12px;
      border-radius:10px;
      color:var(--muted);
    }

    #profiles-list{
      list-style:none;
      padding:0;
      margin:0;
      display:grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap:14px;
    }

    .profile{
      background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      border-radius:12px;
      padding:12px;
      display:flex;
      gap:12px;
      align-items:flex-start;
      border:1px solid rgba(255,255,255,0.03);
      transition:transform .12s ease, box-shadow .12s ease;
    }
    .profile:hover{transform:translateY(-6px); box-shadow:0 18px 40px rgba(2,6,23,0.6)}
    .avatar{
      width:64px;
      height:64px;
      border-radius:12px;
      background:linear-gradient(135deg,var(--accent-2),#8be6d1);
      display:flex;
      align-items:center;
      justify-content:center;
      color:#042022;
      font-weight:700;
      flex-shrink:0;
      font-size:18px;
    }
    .meta{flex:1}
    .meta h4{margin:0 0 6px 0;font-size:15px}
    .meta p{margin:0;color:var(--muted);font-size:13px}
    .tags{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px}
    .tag{
      font-size:12px;
      color:var(--accent-2);
      background:rgba(107,231,196,0.06);
      padding:6px 8px;
      border-radius:999px;
      border:1px solid rgba(107,231,196,0.06);
    }

    .profile-actions{
      display:flex;
      flex-direction:column;
      gap:8px;
      margin-left:8px;
    }
    .btn-ghost{
      background:transparent;
      border:1px solid rgba(255,255,255,0.04);
      color:var(--muted);
      padding:8px 10px;
      border-radius:10px;
      cursor:pointer;
    }

    /* Responsive */
    @media (max-width:980px){
      .container{grid-template-columns:1fr; padding-bottom:40px}
      header{flex-direction:column;align-items:flex-start;gap:8px}
    }
  </style>
</head>



  
<body> 
  
  <div class="container">

<!-- HEADER -->
<header>
  <div class="brand">
    <button id="home-button" class="logo-btn">MD</button>
    <div>
      <h1>Mini Dating Site</h1>
      <p class="lead">Find people who share your interests</p>
    </div>
  </div>

  <div style="display:flex;gap:10px;align-items:center">
    <div id="welcome-box" style="font-size:13px;color:var(--muted);display:none;">
      Welcome <strong id="user-display"></strong>
    </div>

    <button id="my-account-btn" class="secondary" style="display:none;">My Account</button>
    <button id="show-login" class="secondary">Login</button>
    <button id="show-register" class="secondary">Register</button>
    <button id="logout-btn" class="secondary" style="display:none;">Logout</button>
  </div>
</header>

<!-- AUTH SECTION -->
<section id="auth" class="card" style="display:none;">
  <h2>Register</h2>

  <form id="register-form" autocomplete="off">
    <input type="text" id="reg-username" placeholder="Username" required />
    <input type="password" id="reg-password" placeholder="Password" required />
    <input type="number" id="reg-age" placeholder="Age" min="18" />
    <input type="text" id="reg-bio" placeholder="Short bio" />
    <input type="text" id="reg-interests" placeholder="Interests (comma separated)" />
    <button type="submit">Create account</button>
  </form>

  <hr />

  <h2>Login</h2>
  <form id="login-form" autocomplete="off">
    <input type="text" id="login-username" placeholder="Username" required />
    <input type="password" id="login-password" placeholder="Password" required />
    <button type="submit">Login</button>
  </form>

  <p id="auth-message"></p>
</section>

<!-- MY ACCOUNT (WITH EDITING) -->
<section id="my-account" class="card" style="display:none;">
  <h2>My Account</h2>

  <label>Username (read-only)</label>
  <input id="acc-username" type="text" readonly />

  <label>Age</label>
  <input id="acc-age" type="number" min="0" />

  <label>Bio</label>
  <textarea id="acc-bio"></textarea>

  <label>Interests (comma separated)</label>
  <input id="acc-interests" type="text" />

  <button id="save-profile-btn" class="secondary" style="margin-top:15px;">Save Changes</button>
</section>

<!-- SEARCH / PROFILES -->
<section id="search" class="card">
  <h2>Browse Profiles</h2>

  <div class="controls">
    <button id="load-profiles" class="btn-ghost">Load all profiles</button>
    <div style="flex:1"></div>
  </div>

  <h3 style="margin:8px 0 6px 0;color:var(--muted);">Search by interest</h3>

  <div class="controls" style="margin-bottom:18px;">
    <input type="text" id="search-interest" placeholder="e.g. hiking" />
    <button id="search-button">Search</button>
  </div>

  <ul id="profiles-list"></ul>
</section>

</div>

<script src="app.js"></script>

</body>


  

</html>
